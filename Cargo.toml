[package]
name = "appmenu-gradient-sort"
version = "0.1.0"
edition = "2021"
authors = ["toocels <toocels@gmail.com>"]
description = "A fast CLI and TUI utility to sort and organize the GNOME Shell application grid by color gradient, alphabetically, or randomly."
readme = "README.md"
license = "GPL-3.0-or-later"
repository = "https://github.com/toocels/gnome_appmenu_sort"
homepage = "https://github.com/toocels/gnome_appmenu_sort"
keywords = ["gnome", "appmenu", "gradient", "tui", "customization"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
image = "0.25"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
dirs = "6"
walkdir = "2"
anyhow = "1"
chrono = "0.4"
rand = "0.8"
